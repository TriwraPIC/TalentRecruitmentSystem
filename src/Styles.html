<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f4e79;          /* 與試算表標題列同色，讓使用者一眼認得是同一套系統 */
    --canvas: #eef1f4;
    --paper: #ffffff;
    --line: #d6dce3;
    --text: #1c2733;
    --muted: #5d6978;
    --s-screen: #a3660f;     /* 待初選 */
    --s-sched: #2463a6;      /* 約面試 */
    --s-done: #23706f;       /* 已面試 */
    --s-eval: #6a4bb5;       /* 評估中 */
    --s-offer: #2c7a4b;      /* 錄取 */
    --s-closed: #6f7b88;     /* 結案 */
    --warn-bg: #fff6dc;
    --warn: #7a5000;
    --danger: #b3261e;
    --r-sm: 4px;
    --r-md: 8px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--canvas); color: var(--text);
    font: 15px/1.6 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* 頂列 */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 10px 24px; background: var(--ink); color: #fff;
  }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .02em; }
  .brand small { font-weight: 400; opacity: .75; margin-left: 8px; font-size: 13px; }
  .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sync { font-size: 12px; opacity: .75; margin-right: 4px; }
  .me { font-size: 13px; opacity: .9; padding-left: 10px; border-left: 1px solid rgba(255,255,255,.3); }

  .btn {
    display: inline-block; text-decoration: none; white-space: nowrap; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper); border-radius: var(--r-sm); padding: 6px 14px;
  }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.danger { color: var(--danger); border-color: #e3b7b3; }
  .btn.small { padding: 2px 10px; font-size: 13px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .topbar .btn.primary { background: #fff; color: var(--ink); border-color: #fff; }
  .topbar .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
  .topbar .btn.ghost:hover { border-color: #fff; }
  .badge {
    display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px;
    background: #e8453c; color: #fff; font-size: 12px; line-height: 18px; text-align: center;
  }

  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }

  /* 流程列：依序排列的招募階段，同時也是篩選器 */
  .pipeline {
    display: flex; background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--r-md); overflow-x: auto; margin-bottom: 16px;
  }
  .stage {
    flex: 1 1 0; min-width: 104px; position: relative; cursor: pointer; text-align: left;
    padding: 12px 14px 10px; border: 0; border-right: 1px solid var(--line); background: none;
  }
  .stage:last-child { border-right: 0; }
  .stage .n { display: block; font-size: 26px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--c, var(--text)); }
  .stage .l { display: block; font-size: 13px; color: var(--muted); }
  .stage.todo .l::after {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #e8453c; margin-left: 6px; vertical-align: middle;
  }
  .stage[aria-pressed="true"] { background: #f4f7fb; box-shadow: inset 0 -3px 0 var(--c, var(--ink)); }
  .stage.all { flex: 0 0 auto; border-left: 1px dashed var(--line); }

  .c-screening { --c: var(--s-screen); }
  .c-assign { --c: #8a4f9e; }
  .c-to_schedule, .c-scheduled { --c: var(--s-sched); }
  .test-banner { background: #fff4d6; color: #7a5300; text-align: center; font-size: 13px; padding: 5px 12px; border-bottom: 1px solid #f0d58a; }
  .c-await_result { --c: var(--s-done); }
  .c-eval { --c: var(--s-eval); }
  .c-offer { --c: var(--s-offer); }
  .c-closed { --c: var(--s-closed); }

  /* 清單 */
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .toolbar input[type=search] {
    flex: 1; max-width: 360px; padding: 7px 12px; border: 1px solid var(--line);
    border-radius: var(--r-sm); background: var(--paper);
  }
  .count { color: var(--muted); font-size: 13px; }
  .table-wrap { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); overflow-x: auto; }
  table.list { width: 100%; border-collapse: collapse; min-width: 780px; }
  .list th {
    text-align: left; font-weight: 500; font-size: 13px; color: var(--muted);
    padding: 9px 12px; background: #f7f9fb; border-bottom: 1px solid var(--line);
  }
  .list td { padding: 10px 12px; border-bottom: 1px solid #edf0f3; vertical-align: top; }
  .list tbody tr:last-child td { border-bottom: 0; }
  .list tbody tr[data-id] { cursor: pointer; }
  .list tbody tr[data-id]:hover { background: #f7f9fc; }
  .list tbody tr.active { background: #eaf1f8; }
  .name { font-weight: 700; }
  .sub { display: block; font-size: 12.5px; color: var(--muted); }
  .flag { color: var(--warn); background: var(--warn-bg); font-size: 12px; font-weight: 500; padding: 0 6px; border-radius: 3px; margin-left: 4px; }
  .pill {
    display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap;
    color: var(--c); background: color-mix(in srgb, var(--c) 11%, #fff); border: 1px solid color-mix(in srgb, var(--c) 30%, #fff);
  }
  .empty, .loading { padding: 40px 20px; text-align: center; color: var(--muted); }

  /* 右側詳細資料 */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); z-index: 10;
    display: flex; flex-direction: column; background: var(--paper);
    border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(20,40,60,.12);
  }
  .drawer[hidden] { display: none; }
  .drawer-head { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .drawer-head h2 { margin: 0; font-size: 20px; }
  .drawer-head h2 .sub { display: inline; font-weight: 400; margin-left: 6px; }
  .drawer-body { overflow-y: auto; padding: 16px 20px 48px; flex: 1; }
  .x { margin-left: auto; border: 0; background: none; font-size: 24px; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 8px; }
  .section { margin-top: 22px; }
  .section h3 { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 0 0 8px; color: var(--ink); font-weight: 700; }
  .section h3 .btn { margin-left: auto; font-weight: 400; }
  .action { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--ink)); border-radius: var(--r-sm); padding: 12px 14px; background: #fbfcfd; }
  .action p { margin: 0 0 8px; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13.5px; }
  .warn ul { margin: 4px 0 0; padding-left: 20px; }
  dl.info { display: grid; grid-template-columns: 8em 1fr; gap: 6px 12px; margin: 0; }
  dl.info dt { color: var(--muted); font-size: 13.5px; }
  dl.info dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .pre { white-space: pre-wrap; word-break: break-word; }

  /* 表單 */
  .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
  .form .full { grid-column: 1 / -1; }
  .form label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
  .form input, .form select, .form textarea {
    padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r-sm);
    background: #fff; color: var(--text); font-size: 14.5px; min-width: 0;
  }
  .form textarea { min-height: 72px; resize: vertical; }
  .req::after { content: " *"; color: var(--danger); }
  .row-btns { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .row-btns .left { margin-right: auto; }

  .review { border-top: 1px solid #edf0f3; padding: 10px 0; }
  .review:first-child { border-top: 0; padding-top: 0; }
  .review .who { font-weight: 700; }
  .hist { font-size: 13px; color: var(--muted); padding-left: 18px; margin: 8px 0 0; }
  .hist li { margin: 3px 0; }
  details summary { cursor: pointer; color: var(--ink); font-size: 14px; font-weight: 700; }

  /* 對話框 */
  .modal {
    position: fixed; inset: 0; z-index: 20; overflow-y: auto;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; background: rgba(15,30,45,.45);
  }
  .modal[hidden] { display: none; }
  .modal-card { background: var(--paper); border-radius: var(--r-md); width: min(760px, 100%); padding: 20px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal-card.narrow { width: min(460px, 100%); }
  .modal-card.wide { width: min(1000px, 100%); }
  .modal-card h2 { margin: 0 0 14px; font-size: 19px; }
  .dup { margin-top: 12px; }
  .feed-item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid #edf0f3; background: none; padding: 10px 6px; cursor: pointer; }
  .feed-item:hover { background: #f7f9fc; }
  .feed-item.unread { background: #f0f6ff; }
  .feed-item .t { font-size: 12px; color: var(--muted); }
  .resume-frame { width: 100%; height: 72vh; border: 1px solid var(--line); border-radius: var(--r-sm); }
  .pdf-pages { height: 72vh; overflow-y: auto; background: #e4e8ec; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; }
  .pdf-page { display: block; width: 100%; height: auto; margin: 0 auto 10px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15); }

  [hidden] { display: none !important; }   /* 任何元素加上 hidden 就一定隱藏 */
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { background: #1c2733; color: #fff; padding: 9px 16px; border-radius: var(--r-sm); font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  .toast.err { background: var(--danger); color: #fff; }


  /* 登入與首頁 */
  .login-overlay {
    position: fixed; inset: 0; z-index: 40; overflow-y: auto;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 12vh 16px 40px; background: var(--canvas);
  }
  .login-card { width: min(420px, 100%); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); padding: 24px 26px; box-shadow: 0 10px 30px rgba(20,40,60,.08); }
  .login-brand { color: var(--ink); font-weight: 700; font-size: 14px; letter-spacing: .03em; }
  .login-card h2 { margin: 6px 0 4px; font-size: 22px; }
  .home-card { max-width: 520px; margin: 40px auto; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); padding: 24px 26px; }
  .home-card h2 { margin: 0; font-size: 21px; }
  .home-link { display: block; margin-top: 14px; padding: 14px 16px; border: 1px solid var(--line); border-left: 4px solid var(--ink); border-radius: var(--r-sm); text-decoration: none; color: var(--text); }
  .home-link:hover { background: #f4f7fb; }
  .home-link b { display: block; font-size: 16px; color: var(--ink); }

  @media (max-width: 640px) {
    .topbar { padding: 10px 14px; }
    main { padding: 14px; }
    .form { grid-template-columns: 1fr; }
    .me { display: none; }
    dl.info { grid-template-columns: 6.5em 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
