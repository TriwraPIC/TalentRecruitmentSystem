<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <style>
    :root { --ink: #1f4e79; --soft: #e8f0f7; --text: #1c2733; --muted: #5d6978; --line: #d6dce3; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef1f4; color: var(--text);
      font: 16px/1.75 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
    .card { background: #fff; border-radius: 10px; padding: 28px 28px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .org { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
    h1 { font-size: 23px; line-height: 1.45; margin: 0 0 6px; }
    .meta { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
    .hint { background: var(--soft); border-left: 5px solid var(--ink); padding: 12px 16px; border-radius: 4px; margin: 0 0 8px; }
    .hint b { color: var(--ink); }
    h2 { font-size: 18px; color: var(--ink); border-bottom: 2px solid var(--ink); padding-bottom: 4px; margin: 28px 0 12px; }
    p { margin: 0 0 10px; }
    .task { margin: 0 0 14px; }
    .task b { color: var(--text); }
    .eg { color: var(--muted); font-size: 14px; margin-left: 1.2em; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    td, th { border: 1px solid var(--line); padding: 7px 10px; vertical-align: top; text-align: left; }
    th { background: var(--ink); color: #fff; font-weight: 700; }
    td.k { background: var(--soft); font-weight: 700; width: 13em; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .two h3 { font-size: 15px; margin: 0 0 4px; }
    ul { margin: 0; padding-left: 1.3em; }
    li { margin: 2px 0; }
    .q { margin: 0 0 8px; }
    .q b { color: var(--ink); margin-right: 6px; }
    .note { color: var(--muted); font-size: 14px; margin: -4px 0 8px; }
    .foot { color: var(--muted); font-size: 13px; margin-top: 26px; font-style: italic; }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    @media (max-width: 600px) {
      .card { padding: 20px 16px 14px; }
      .two { grid-template-columns: 1fr; }
      td.k { width: auto; white-space: normal; }
    }
    @media print { body { background: #fff; } .card { box-shadow: none; padding: 0; } }
  </style>
</head>
<body>
<div class="wrap">
<? if (!p) { ?>
  <div class="card empty">
    <p>找不到這份工作說明，可能網址有誤或計畫已下架。</p>
    <p>如有疑問，請回覆邀請您面試的人資窗口。</p>
  </div>
<? } else { var c = p.candidate || {}; ?>
  <div class="card">
    <p class="org">財團法人台灣水資源與農業研究院｜應徵者工作說明</p>
    <h1><?= p.title ?></h1>
    <p class="meta">委託機關：<?= p.client ?>　｜　計畫年度：<?= p.year ?></p>
    <? if (p.empty) { ?><p class="hint">這份工作說明準備中，詳細內容會在面試時說明。</p><? } ?>
    <? if (c.position_hint) { ?><p class="hint"><b>職務定位　</b><?= c.position_hint ?></p><? } ?>

    <? if (!p.empty) { ?>
    <h2>一、這個計畫在做什麼</h2>
    <p><?= c.project_intro ?></p>
    <? if (c.why_it_matters) { ?><p><b>工作的意義：</b><?= c.why_it_matters ?></p><? } ?>

    <? if ((c.main_tasks || []).length) { ?>
    <h2>二、你會負責的工作</h2>
    <? c.main_tasks.forEach(function (t, i) { ?>
      <div class="task"><b><?= (i + 1) + '. ' + t.name ?></b>　<?= t.description ?></div>
    <? }); } ?>

    <h2>三、我們在找這樣的你</h2>
    <div class="two">
      <div><h3>需要具備</h3><ul><? (c.skills_required || []).forEach(function (x) { ?><li><?= x ?></li><? }); ?></ul></div>
      <div><h3>有的話更好</h3><ul><? (c.skills_plus || []).forEach(function (x) { ?><li><?= x ?></li><? }); ?></ul></div>
    </div>

    <? if ((c.work_style || []).length) { ?>
    <h2>四、工作型態</h2>
    <ul><? c.work_style.forEach(function (x) { ?><li><?= x ?></li><? }); ?></ul>
    <? } ?>

    <? } ?>
    <p class="foot">本說明依本院過往同類計畫整理，實際工作內容以當年度契約及主管安排為準。</p>
  </div>
<? } ?>
</div>
</body>
</html>
